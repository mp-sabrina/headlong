[project]
name = "headlong-email-bridge"
version = "0.1.0"
description = "Resend inbound-webhook email bridge for a Headlong identity"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
headlong-email-bridge = "headlong_email.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headlong_email"]
